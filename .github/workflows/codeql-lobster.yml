# Reusable workflow: scan the calling repository's Lobster files and upload SARIF to Code scanning.
# Unofficial community project. Not made or endorsed by GitHub or the CodeQL team.
# Callers:
#   jobs:
#     lobster:
#       uses: flisk-sh/codeql-lobster/.github/workflows/codeql-lobster.yml@<full commit SHA>
#       permissions:
#         contents: read
#         security-events: write
name: 🔬 CodeQL Lobster (unofficial)

on:
  workflow_call:
    inputs:
      patterns:
        description: Space-separated globs, relative to the caller's repository root.
        type: string
        required: false
        default: "**/*.lobster"
      category:
        description: SARIF category shown in Code scanning. Keep it distinct from other analyzers.
        type: string
        required: false
        default: /language:lobster
      fail-on-findings:
        description: Fail the job when the analyzer reports any result. Off by default, matching report-only scanners.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  analyze:
    name: 🔬 Analyze Lobster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The analyzer is checked out at the same commit as this workflow, so a caller pinned to a SHA runs the matching rules.
      - name: Check out the analyzer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/codeql-lobster
          ref: ${{ github.workflow_sha }}
          path: .codeql-lobster
          persist-credentials: false

      - name: Analyze
        env:
          PATTERNS: ${{ inputs.patterns }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set -euo pipefail
          set -f # keep the globs literal; the analyzer expands them
          args=()
          for pattern in $PATTERNS; do
            args+=(--pattern "$pattern")
          done
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            args+=(--fail-on-findings)
          fi
          python3 .codeql-lobster/lobster_analyze.py --root . --output codeql-lobster.sarif "${args[@]}"

      - name: Upload SARIF
        if: ${{ always() && hashFiles('codeql-lobster.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: codeql-lobster.sarif
          category: ${{ inputs.category }}
